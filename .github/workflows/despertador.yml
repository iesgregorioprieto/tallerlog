name: Despertador Supabase

on:
  schedule:
    - cron: "0 5 * * 0,3"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a Supabase para evitar pausa por inactividad
        run: |
          echo "Lanzando consulta a Supabase de TallerLog..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/alumnos?select=id&limit=1")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "OK - Supabase activo y respondiendo"
          else
            echo "AVISO - Respuesta inesperada: $STATUS"
            exit 1
          fi
